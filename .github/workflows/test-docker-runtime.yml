name: Test Manual Install (Docker)

on:
  push:
    branches:
      - main
      - update-docs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  docker-manual-install:
    uses: ./.github/workflows/reusable-runtime-flow.yml
    with:
      runtime: docker
      scenario: manual
      timeout_minutes: 20
    secrets: inherit

  docker-installer-flow:
    uses: ./.github/workflows/reusable-runtime-flow.yml
    with:
      runtime: docker
      scenario: installer
      timeout_minutes: 25
    secrets: inherit


