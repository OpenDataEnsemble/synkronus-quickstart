name: Test Upgrade Path

on:
  push:
    branches:
      - main
      - update-docs
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  upgrade-path-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_NAME: upgrade-path-docker

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify docker runtime
        run: |
          set -euo pipefail
          command -v docker
          docker version
          docker compose version

      - name: Run upgrade-path migration test (docker)
        run: |
          set -euo pipefail
          chmod +x ./.github/scripts/upgrade-path-flow.sh
          ./.github/scripts/upgrade-path-flow.sh docker "$PROJECT_NAME"

  upgrade-path-podman:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_NAME: upgrade-path-podman
      PODMAN_COMPOSE_PROVIDER: podman-compose

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install podman and compose support
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y podman podman-compose

      - name: Log in to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Verify podman runtime
        run: |
          set -euo pipefail
          command -v podman
          podman --version
          command -v podman-compose
          podman-compose version
          podman compose version

      - name: Run upgrade-path migration test (podman)
        run: |
          set -euo pipefail
          chmod +x ./.github/scripts/upgrade-path-flow.sh
          ./.github/scripts/upgrade-path-flow.sh podman "$PROJECT_NAME"
