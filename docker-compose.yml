services:
  synkronus:
    image: ghcr.io/opendataensemble/synkronus:latest
    container_name: synkronus
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      DB_CONNECTION: "postgres://synkronus_user:im97C1wauDvbHDREP51Vk2OfVeFp092@db:5432/synkronus?sslmode=disable" # create with ~/create_synk_db demo
      JWT_SECRET: "ib2Xz57D7VQhkmMTWL0AVubCZblH8fvQzUKiEz6T8M" # Generate a new one with: openssl rand -base64 32
      ADMIN_USERNAME: "admin_0d16c0"
      ADMIN_PASSWORD: "orK5BcLcpDPamf5OKiYFC0hw"
      MAX_VERSIONS_KEPT: "2"
    expose:
      - "8080" # in case you want to place a proxy, eg. nginx, in front of synkronus
    volumes:
      - appdata:/app/data # single mount for bundles, version history, and attachments (chown 1000:1000 if bind-mounting a host dir)
    depends_on:
      - db
    restart: unless-stopped
    healthcheck: ## This can be removed when the synkronus image is updated to support HEAD requests for /health
      test: ["CMD", "wget", "-qO-", "--tries=1", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  db:
    image: docker.io/library/postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: synkronus_user
      POSTGRES_PASSWORD: im97C1wauDvbHDREP51Vk2OfVeFp092 # change this!
      POSTGRES_DB: synkronus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synkronus_user -d synkronus"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  appdata:
